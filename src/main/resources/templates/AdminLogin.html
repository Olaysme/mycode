<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin login | Portfolio</title>
    <style>
        :root { --page:#090a0c; --panel:#121316; --line:#292a2f; --text:#f4f4f5; --muted:#9fa1ae; --accent:#7585ff; --danger:#ff8c8c; }
        * { box-sizing:border-box; }
        body { min-width:320px; min-height:100vh; display:grid; place-items:center; margin:0; padding:24px; color:var(--text); background:var(--page); font-family:Inter,ui-sans-serif,system-ui,sans-serif; }
        main { width:min(100%,460px); padding:40px; border:1px solid var(--line); border-radius:20px; background:var(--panel); }
        h1 { margin:0 0 10px; font-size:32px; }
        p { color:var(--muted); line-height:1.5; }
        label { display:block; margin:28px 0 9px; font-weight:700; }
        input { width:100%; min-height:54px; padding:0 16px; border:1px solid #3a3b43; border-radius:10px; color:var(--text); background:#0d0e11; font:inherit; }
        input:focus { outline:2px solid var(--accent); outline-offset:1px; }
        button { width:100%; min-height:54px; margin-top:18px; border:0; border-radius:10px; color:#11131b; background:var(--accent); font:700 16px inherit; cursor:pointer; }
        .error { color:var(--danger); }
        a { color:var(--muted); }
    </style>
</head>
<body>
<main>
    <a href="/">← Back to website</a>
    <h1>Admin login</h1>
    <p>Sign in to edit the website content.</p>
    <p class="error" th:if="${error}" th:text="${error}"></p>
    <form method="post" action="/admin/login">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autofocus autocomplete="current-password">
        <button type="submit">Sign in</button>
    </form>
</main>
</body>
</html>
