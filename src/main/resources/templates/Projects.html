<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Selected development projects by Olayinka Solaja.">
    <title>Projects | Olayinka Solaja</title>
    <style>
        :root {
            --page: #090a0c;
            --card: #111216;
            --preview: #15161d;
            --line: #292a2f;
            --text: #f3f3f4;
            --muted: #999ca9;
            --accent: #7585ff;
            --tag: #1b2038;
        }

        /* Basic reset and shared dark page style. */
        * { box-sizing: border-box; }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            color: var(--text);
            background: var(--page);
            border-top: 1px solid var(--line);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .projects {
            width: min(100% - 196px, 1832px);
            margin: 0 auto;
            padding: 93px 0 58px;
        }

        .eyebrow {
            margin: 0;
            color: var(--accent);
            font-size: 23px;
            font-weight: 800;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        h1 {
            margin: 37px 0 82px;
            font-size: clamp(48px, 3.45vw, 63px);
            line-height: 1.1;
            letter-spacing: -.065em;
        }

        /* Three equal cards on desktop, fewer columns on smaller screens. */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 37px;
        }

        .project-card {
            overflow: hidden;
            border: 2px solid var(--line);
            border-radius: 22px;
            background: var(--card);
            transition: transform .2s ease, border-color .2s ease;
        }

        .project-card:hover { transform: translateY(-4px); border-color: #43454e; }

        /* Placeholder area for a future project image or screenshot. */
        .preview {
            height: 248px;
            display: grid;
            place-items: center;
            border-bottom: 1px solid #16171d;
            background: linear-gradient(145deg, #171820, #12131a);
            color: #9295a5;
            font-size: 23px;
            letter-spacing: .015em;
        }

        .project-content { padding: 43px 39px 38px; }

        h2 {
            margin: 0;
            font-size: clamp(23px, 1.5vw, 30px);
            line-height: 1.2;
            letter-spacing: -.05em;
        }

        .description {
            min-height: 82px;
            margin: 24px 0 27px;
            color: var(--muted);
            font-size: clamp(20px, 1.42vw, 26px);
            line-height: 1.47;
            letter-spacing: -.45px;
        }
                /* Header: brand on the left, navigation in the middle, action on the right. */
                .site-header {
            height: 131px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--line);
        }

        .nav-shell, .hero {
            width: min(100% - 80px, 1828px);
            margin: 0 auto;
        }

        .nav-shell {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
        }

        .brand { color: #fff; font-size: 28px; font-weight: 700; letter-spacing: -1.3px; }

        nav { display: flex; gap: clamp(34px, 4vw, 72px); }

        nav a {
            color: var(--muted);
            font-size: 27px;
            letter-spacing: -.7px;
            transition: color .2s ease;
        }

        nav a:hover { color: var(--text); }

        .contact-link {
            justify-self: end;
            padding: 20px 33px;
            border-radius: 12px;
            color: #111216;
            background: #f4f4f2;
            font-size: 23px;
            font-weight: 700;
            /* transition: transform .2s ease, background .2s ease; */
        }

        .contact-link:hover, .primary:hover { transform: translateY(-2px); }

        /* Small, consistent navigation back to the landing page. */

        .back-nav {
            position: absolute;
            top: 28px;
            left: max(40px, calc((100% - 1828px) / 2));
        }

        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 12px 18px;
            border: 1px solid var(--line);
            border-radius: 10px;
            color: var(--text);
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            /* transition: background .2s ease, border-color .2s ease; */
        }

        .back-home:hover { border-color: var(--label); background: #15182a; }

        /* Technology tags wrap naturally when there is not enough space. */
        .tags { display: flex; flex-wrap: wrap; gap: 14px; }

        .tag {
            padding: 9px 16px;
            border-radius: 10px;
            color: var(--accent);
            background: var(--tag);
            font-size: 20px;
            line-height: 1.2;
        }

        .note {
            margin: 48px 0 0;
            color: var(--muted);
            font-size: 22px;
            letter-spacing: -.35px;
        }

        @media (max-width: 1120px) {
            .projects { width: min(100% - 80px, 1832px); }
            .project-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }

        @media (max-width: 700px) {
            .projects { width: min(100% - 40px, 1832px); padding-top: 61px; }
            .eyebrow { font-size: 18px; }
            h1 { margin: 26px 0 48px; font-size: 45px; }
            .project-grid { grid-template-columns: 1fr; gap: 22px; }
            .preview { height: 190px; font-size: 18px; }
            .project-content { padding: 30px 28px; }
            .description { min-height: 0; margin: 17px 0 22px; font-size: 20px; }
            .tag { padding: 8px 13px; font-size: 16px; }
            .note { margin-top: 34px; font-size: 18px; line-height: 1.45; }
        }
    </style>
    <link rel="stylesheet" href="/css/site.css">
</head>
<body>
    <header class="site-header">
        <div class="nav-shell">
            <a class="brand" href="/" th:text="${site['site.name']}">Olayinka Solaja</a>
            <nav aria-label="Primary navigation">
                <a href="/services">Services</a>
                <a href="/projects">Projects</a>
                <a href="/about">About</a>
            </nav>
            <a class="contact-link" href="/contact">Get in touch</a>
        </div>
    </header>
    <main class="projects">
        <p class="eyebrow">Projects</p>
        <h1>Selected work</h1>

        <section class="project-grid" aria-label="Selected projects">
            <article class="project-card" th:each="number : ${projectNumbers}">
                <div class="preview" th:if="${#strings.isEmpty(site['project.' + number + '.image'])}" aria-label="Project preview placeholder">IMAGE COMING SOON</div>
                <img class="project-image" th:unless="${#strings.isEmpty(site['project.' + number + '.image'])}" th:src="${site['project.' + number + '.image']}" th:alt="${site['project.' + number + '.title']}">
                <div class="project-content">
                    <h2 th:text="${site['project.' + number + '.title']}">Project title</h2>
                    <p class="description" th:text="${site['project.' + number + '.description']}">Project description</p>
                    <div class="tags" aria-label="Technologies">
                        <span class="tag" th:each="tag : ${#strings.arraySplit(site['project.' + number + '.tags'], ',')}" th:text="${#strings.trim(tag)}">Technology</span>
                    </div>
                </div>
            </article>
        </section>

        <p class="note" th:text="${site['projects.note']}">These three projects are placeholders — swap in real case studies and links whenever you're ready.</p>
    </main>
</body>
</html>
