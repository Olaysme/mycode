<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Get in touch with Olayinka Solaja to discuss your project.">
    <title>Get in touch | Olayinka Solaja</title>
    <style>
        /* Shared colors keep this page consistent with the rest of the site. */
        :root {
            --page: #090a0c;
            --panel: #121316;
            --line: #292a2f;
            --text: #f4f4f5;
            --muted: #9fa1ae;
            --accent: #7585ff;
        }

        /* Basic page setup. */
        * { box-sizing: border-box; }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            color: var(--text);
            background: var(--page);
            border: 1px solid var(--line);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* The page uses flex so the footer stays near the bottom. */
        .page {
            min-height: calc(100vh - 2px);
            display: flex;
            flex-direction: column;
            padding: 90px 80px 55px;
        }

        /* Centered contact panel. */
        .contact-card {
            width: min(100%, 1814px);
            min-height: 493px;
            display: grid;
            place-content: center;
            justify-items: center;
            padding: 70px 35px;
            margin: 0 auto;
            border: 2px solid var(--line);
            border-radius: 29px;
            background: var(--panel);
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: clamp(43px, 3.15vw, 62px);
            line-height: 1.08;
            letter-spacing: -.065em;
        }

        .intro {
            margin: 39px 0 52px;
            color: var(--muted);
            font-size: clamp(20px, 1.55vw, 28px);
            line-height: 1.45;
            letter-spacing: -.45px;
        }
                /* Header: brand on the left, navigation in the middle, action on the right. */
                .site-header {
            height: 131px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--line);
        }

        .nav-shell, .hero {
            width: min(100% - 80px, 1828px);
            margin: 0 auto;
        }

        .nav-shell {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
        }

        .brand { color: #fff; font-size: 28px; font-weight: 700; letter-spacing: -1.3px; }

        nav { display: flex; gap: clamp(34px, 4vw, 72px); }

        nav a {
            color: var(--muted);
            font-size: 27px;
            letter-spacing: -.7px;
            transition: color .2s ease;
        }

        nav a:hover { color: var(--text); }

        .contact-link {
            justify-self: end;
            padding: 20px 33px;
            border-radius: 12px;
            color: #111216;
            background: #f4f4f2;
            font-size: 23px;
            font-weight: 700;
            transition: transform .2s ease, background .2s ease;
        }

        .contact-link:hover, .primary:hover { transform: translateY(-2px); }

        /* Small, consistent navigation back to the landing page. */
        .back-nav {
            position: absolute;
            top: 28px;
            left: max(40px, calc((100% - 1828px) / 2));
        }

        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 12px 18px;
            border: 1px solid var(--line);
            border-radius: 10px;
            color: var(--text);
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            transition: background .2s ease, border-color .2s ease;
        }

        .back-home:hover { border-color: var(--label); background: #15182a; }

        /* Contact links look like buttons and sit side by side on desktop. */
        .actions { display: flex; justify-content: center; gap: 24px; }

        .action {
            min-height: 86px;
            display: inline-grid;
            place-items: center;
            padding: 0 42px;
            border: 2px solid var(--line);
            border-radius: 13px;
            color: var(--text);
            font-size: clamp(18px, 1.3vw, 24px);
            font-weight: 700;
            text-decoration: none;
            transition: transform .2s ease, border-color .2s ease;
        }

        .action:hover { transform: translateY(-2px); border-color: #4b4e59; }
        .action.primary { border-color: var(--accent); color: #11131b; background: var(--accent); }

        footer {
            margin-top: auto;
            padding-top: 60px;
            color: var(--muted);
            font-size: 21px;
            text-align: center;
        }

        /* On small screens, stack the buttons and reduce spacing. */
        @media (max-width: 600px) {
            .page { padding: 35px 20px 28px; }
            .contact-card { min-height: 475px; padding: 55px 22px; border-radius: 20px; }
            h1 { font-size: 42px; }
            .intro { margin: 28px 0 39px; font-size: 20px; }
            .actions { width: 100%; flex-direction: column; gap: 13px; }
            .action { width: 100%; min-height: 64px; padding: 0 16px; font-size: 18px; }
            footer { padding-top: 42px; font-size: 16px; }
        }
    </style>
    <link rel="stylesheet" href="/css/site.css">
</head>
<body>
    <header class="site-header">
        <div class="nav-shell">
            <a class="brand" href="/" th:text="${site['site.name']}">Olayinka Solaja</a>
            <nav aria-label="Primary navigation">
                <a href="/services">Services</a>
                <a href="/projects">Projects</a>
                <a href="/about">About</a>
            </nav>
            <a class="contact-link" href="/contact">Get in touch</a>
        </div>
    </header>
    <div class="page">
        <main class="contact-card">
            <h1 th:text="${site['contact.heading']}">Let's build something together</h1>
            <p class="intro" th:text="${site['contact.intro']}">Based in Berlin, available remote or in person. Reach out to talk through your project.</p>
            <div class="actions">
                <a class="action primary" href="mailto:hello@olayinkasolaja.com" th:href="|mailto:${site['contact.email']}|" th:text="${site['contact.email']}">hello@olayinkasolaja.com</a>
                <a class="action" href="https://www.linkedin.com" th:href="${site['contact.linkedin']}" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a>
            </div>
        </main>
        <footer th:text="|© 2026 ${site['site.name']}|">© 2026 Olayinka Solaja</footer>
    </div>
</body>
</html>
